<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>减肥打卡报告 · 目录</title>
<style>
  :root{
    --teal:#2E9599; --teal-2:#3fb0b4; --purple:#6C7BE0;
    --ink:#1f2937; --muted:#6b7280;
    --line:rgba(0,0,0,.07); --bg:#f4f6f8;
    --card:#ffffff; --card-hover:#f5f9f9;
    --hero-grad:linear-gradient(135deg,#2E9599 0%,#4fb8b0 55%,#6C7BE0 100%);
  }
  html[data-theme="dark"]{
    --ink:#e5e7eb; --muted:#9ca3af;
    --line:rgba(255,255,255,.08); --bg:#0f1419;
    --card:#171d23; --card-hover:#1d252c;
    --hero-grad:linear-gradient(135deg,#1f6f73 0%,#2E9599 55%,#4a56b8 100%);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:48px 16px 64px;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
    transition:background .25s, color .25s;
  }
  .page{max-width:760px;margin:0 auto;}

  /* ---------- 头部 ---------- */
  header.hero{
    position:relative; overflow:hidden;
    background:var(--hero-grad); border-radius:22px;
    padding:38px 30px 32px; color:#fff;
    box-shadow:0 14px 36px rgba(46,149,153,.28);
    margin-bottom:22px;
  }
  header.hero::after{
    content:""; position:absolute; right:-60px; top:-60px;
    width:220px; height:220px; border-radius:50%;
    background:rgba(255,255,255,.12);
  }
  header.hero::before{
    content:""; position:absolute; right:40px; bottom:-90px;
    width:160px; height:160px; border-radius:50%;
    background:rgba(255,255,255,.08);
  }
  header.hero h1{margin:0 0 8px; font-size:26px; letter-spacing:.5px; position:relative;}
  header.hero p{margin:0; font-size:14px; opacity:.92; position:relative;}
  .hero-badge{
    display:inline-block; margin-top:16px; padding:4px 12px;
    border-radius:999px; background:rgba(255,255,255,.18);
    font-size:12.5px; position:relative; backdrop-filter:blur(4px);
  }

  /* ---------- 主题切换 ---------- */
  .theme-toggle{
    position:absolute; top:18px; right:18px; z-index:2;
    width:36px; height:36px; border-radius:10px;
    border:none; cursor:pointer; font-size:16px;
    background:rgba(255,255,255,.2); color:#fff;
    display:grid; place-items:center;
    transition:background .15s;
  }
  .theme-toggle:hover{background:rgba(255,255,255,.32);}

  /* ---------- 列表 ---------- */
  .list{
    background:var(--card); border-radius:20px; padding:10px;
    border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(31,41,55,.06);
    transition:background .25s;
  }
  .item{
    display:flex; align-items:center; gap:15px;
    padding:17px 16px; border-radius:14px;
    text-decoration:none; color:var(--ink);
    transition:background .15s, transform .15s;
  }
  .item:hover{background:var(--card-hover); transform:translateX(3px);}
  .item + .item{border-top:1px solid var(--line);}

  .num{
    flex:0 0 40px; width:40px; height:40px; border-radius:12px;
    display:grid; place-items:center;
    font-weight:700; font-size:14px; color:#fff;
    background:linear-gradient(135deg,var(--teal-2),var(--teal));
    box-shadow:0 4px 12px rgba(46,149,153,.28);
  }
  .item:nth-child(even) .num{
    background:linear-gradient(135deg,#8592ee,var(--purple));
    box-shadow:0 4px 12px rgba(108,123,224,.28);
  }
  .meta{flex:1; min-width:0;}
  .meta .name{font-weight:600; font-size:15px; word-break:break-all;}
  .meta .desc{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .arrow{
    flex:0 0 auto; color:var(--muted); font-size:18px; opacity:.55;
    transition:transform .15s, opacity .15s;
  }
  .item:hover .arrow{transform:translateX(3px); opacity:1;}

  .empty{
    padding:44px 20px; text-align:center; color:var(--muted); font-size:14px;
  }

  footer{
    text-align:center; color:var(--muted); font-size:12px;
    margin-top:26px; line-height:1.9;
  }

  @media (max-width:560px){
    body{padding:24px 12px 48px;}
    header.hero{padding:30px 22px 26px; border-radius:18px;}
    header.hero h1{font-size:21px;}
    .item{padding:15px 12px;}
    .num{flex:0 0 36px; width:36px; height:36px; font-size:13px;}
  }
</style>
</head>
<body>
<div class="page">
  <header class="hero">
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">🌙</button>
    <h1>减肥打卡报告</h1>
    <p>阶段性小结 · 按周期归档</p>
    <span class="hero-badge" id="countBadge">共 0 份报告</span>
  </header>

  <div class="list" id="list">
    <div class="empty">正在加载报告列表…</div>
  </div>

  <footer>
    ============ 绝密信息，请勿外传 ============
  </footer>
</div>

<script>
/* ============ 手动维护的报告列表 ============ */
const REPORTS = [
  {
    file: "2026-10-10_10-21.html",
    title: "10-10 至 10-21 减肥 12 天小结",
    desc: "YZ · CY 阶段性复盘"
  }
  /* 新增示例：
  {
    file: "2026-10-22_11-04.html",
    title: "10-22 至 11-04 减肥小结",
    desc: "第二阶段复盘"
  }
  */
];

/* ============ 渲染列表 ============ */
const list = document.getElementById('list');
const badge = document.getElementById('countBadge');

badge.textContent = '共 ' + REPORTS.length + ' 份报告';

if (REPORTS.length === 0) {
  list.innerHTML = '<div class="empty">还没有报告，先在列表里添加一条吧～</div>';
} else {
  list.innerHTML = REPORTS.map(function(r, i){
    return `
      <a class="item" href="./${encodeURI(r.file)}">
        <div class="num">${String(i + 1).padStart(2, '0')}</div>
        <div class="meta">
          <div class="name">${r.title}</div>
          <div class="desc">${r.desc || ''}</div>
        </div>
        <div class="arrow">›</div>
      </a>`;
  }).join('');
}

/* ============ 深色模式 ============ */
const root = document.documentElement;
const btn = document.getElementById('themeToggle');

function applyTheme(theme){
  root.setAttribute('data-theme', theme);
  btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('report-theme', theme); } catch(e){}
}

const saved = (function(){
  try { return localStorage.getItem('report-theme'); } catch(e){ return null; }
})();
const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
applyTheme(saved || (prefersDark ? 'dark' : 'light'));

btn.addEventListener('click', function(){
  applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
